<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--head:#111827;--text:#4b5563;--line:#e5e7eb;--accent:#0f9d6e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1514;--card:#17201e;--head:#f3f4f6;--text:#a3aeab;--line:#26322f}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.card{max-width:420px;margin:48px auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.4rem}
h2{margin:0 0 .4rem;color:var(--head)}
label{display:block;font-size:.78rem;font-weight:700;color:var(--head);margin:.75rem 0 .3rem}
input{width:100%;height:44px;border:1.5px solid var(--line);border-radius:11px;padding:0 .8rem;font:inherit;background:var(--bg);color:var(--head)}
.btn{display:block;width:100%;height:46px;margin-top:1.1rem;border:none;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:800;cursor:pointer;text-align:center;line-height:46px;text-decoration:none}
.err{margin-top:.8rem;padding:.6rem .8rem;border-radius:10px;background:#fee2e2;color:#b91c1c;font-size:.83rem;font-weight:600}
@media (max-width:460px){.card{margin:24px 16px}}
</style>
</head>
<body>
<div class="card">
  {% if valid %}
  <h2>Choose a new password</h2>
  <form method="post">
    {% csrf_token %}
    <label for="password">New password</label>
    <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
    <label for="confirm">Type it again</label>
    <input type="password" id="confirm" name="confirm" minlength="8" autocomplete="new-password" required>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <button class="btn" type="submit">Save and log in</button>
  </form>
  {% else %}
  <h2>This link has expired</h2>
  <p>Reset links work once and only for 2 hours. Ask for a new one from the chat page.</p>
  <a class="btn" href="{% url 'chats_page' %}">Back to chats</a>
  {% endif %}
</div>
</body>
</html>

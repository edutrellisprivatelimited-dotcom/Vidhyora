{% load static %}{% comment %}Theme (light/dark, accent colour, font) shared by the stand-alone pages: error.html and join.html. It reads the same choices the AI page saves on this device.{% endcomment %}
<script>
// Use the same device-level appearance choices as the AI frontend before
// first paint, so even an error page never flashes the old red theme.
(function(){
  try {
    var saved = localStorage.getItem('ai_theme');
    if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
    var colorDefaultVersion = 'emerald-v1';
    if (localStorage.getItem('ai_color_default_version') !== colorDefaultVersion) {
      localStorage.setItem('ai_color_theme', 'emerald');
      localStorage.setItem('ai_color_default_version', colorDefaultVersion);
    }
    var accent = localStorage.getItem('ai_color_theme');
    if (['orange','blue','violet','emerald','crimson'].indexOf(accent) !== -1) {
      document.documentElement.setAttribute('data-accent', accent);
    }
    var font = localStorage.getItem('ai_font_theme');
    if (['default','inter','poppins','manrope','jakarta','sora','urbanist','lexend','spacegrotesk','nunito','worksans','figtree','librefranklin','epilogue','dmsans'].indexOf(font) !== -1) {
      document.documentElement.setAttribute('data-font', font);
    }
  } catch (e) {}
})();
</script>
